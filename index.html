<!doctype html>
<html lang="bn" data-theme="deep-rose-gold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Museum of Us — Interactive Keepsake</title>
    <meta name="description" content="A handcrafted interactive digital museum and personalized keepsake gift." />
    <meta property="og:title" content="Museum of Us — Interactive Keepsake" />
    <meta property="og:description" content="A handcrafted interactive digital museum and personalized keepsake gift." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Editorial Serif + Sans + Bengali Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Firebase Compat SDK (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <style>
      /* =========================================================
         MULTI-COLOR BACKGROUND PALETTES (6 CURATED + CUSTOM)
         ========================================================= */
      :root,
      [data-theme="deep-rose-gold"] {
        --bg: #fff4f7;
        --bg-gradient:
          radial-gradient(circle at 12% 14%, rgba(219, 39, 119, 0.16), transparent 44%),
          radial-gradient(circle at 88% 18%, rgba(253, 224, 71, 0.28), transparent 46%),
          radial-gradient(circle at 75% 85%, rgba(244, 114, 182, 0.18), transparent 48%),
          linear-gradient(135deg, #fff4f7 0%, #fef9c3 50%, #fce7f3 100%);
        --surface: #fdeaf2;
        --surface-elevated: rgba(255, 255, 255, 0.94);
        --ink: #2c101b;
        --ink-muted: #6e3d51;
        --accent: #be185d;
        --accent-hover: #9d174d;
        --accent-soft: rgba(190, 24, 93, 0.12);
        --accent-contrast: #ffffff;
        --border: rgba(157, 23, 77, 0.16);
        --gold: #d97706;
        --shadow: 0 20px 50px -15px rgba(157, 23, 77, 0.16);
      }

      [data-theme="blush-honey"] {
        --bg: #fffaf0;
        --bg-gradient:
          radial-gradient(circle at 15% 20%, rgba(251, 207, 232, 0.45), transparent 45%),
          radial-gradient(circle at 85% 25%, rgba(254, 240, 138, 0.48), transparent 48%),
          linear-gradient(145deg, #fff1f5 0%, #fefce8 55%, #ffe4e6 100%);
        --surface: #fff3d6;
        --surface-elevated: rgba(255, 255, 255, 0.94);
        --ink: #331621;
        --ink-muted: #784b59;
        --accent: #e11d48;
        --accent-hover: #be123c;
        --accent-soft: rgba(225, 29, 72, 0.11);
        --accent-contrast: #ffffff;
        --border: rgba(217, 119, 6, 0.2);
        --gold: #eab308;
        --shadow: 0 20px 50px -15px rgba(180, 83, 9, 0.14);
      }

      [data-theme="velvet-marigold"] {
        --bg: #1b0b13;
        --bg-gradient:
          radial-gradient(circle at 16% 18%, rgba(219, 39, 119, 0.28), transparent 46%),
          radial-gradient(circle at 84% 22%, rgba(245, 158, 11, 0.2), transparent 44%),
          radial-gradient(circle at 72% 85%, rgba(157, 23, 77, 0.34), transparent 50%),
          linear-gradient(145deg, #1b0b13 0%, #2b101e 50%, #190d14 100%);
        --surface: #2f1423;
        --surface-elevated: rgba(45, 19, 33, 0.94);
        --ink: #fff5f8;
        --ink-muted: #e5b7c8;
        --accent: #f472b6;
        --accent-hover: #ec4899;
        --accent-soft: rgba(244, 114, 182, 0.18);
        --accent-contrast: #1b0b13;
        --border: rgba(253, 224, 71, 0.22);
        --gold: #fbbf24;
        --shadow: 0 24px 55px -16px rgba(0, 0, 0, 0.65);
      }

      [data-theme="petal-champagne"] {
        --bg: #fdf2f8;
        --bg-gradient:
          radial-gradient(circle at 10% 10%, rgba(190, 24, 93, 0.14), transparent 40%),
          radial-gradient(circle at 90% 12%, rgba(234, 179, 8, 0.22), transparent 42%),
          radial-gradient(circle at 85% 88%, rgba(254, 249, 195, 0.55), transparent 46%),
          linear-gradient(120deg, #fce7f3 0%, #fef9c3 50%, #fff1f2 100%);
        --surface: #fce7f3;
        --surface-elevated: rgba(255, 255, 255, 0.94);
        --ink: #2b121c;
        --ink-muted: #6b3b4c;
        --accent: #db2777;
        --accent-hover: #9d174d;
        --accent-soft: rgba(219, 39, 119, 0.12);
        --accent-contrast: #ffffff;
        --border: rgba(219, 39, 119, 0.18);
        --gold: #ca8a04;
        --shadow: 0 20px 50px -15px rgba(219, 39, 119, 0.16);
      }

      [data-theme="sunset-peach-rose"] {
        --bg: #fff5f0;
        --bg-gradient:
          radial-gradient(circle at 18% 15%, rgba(251, 146, 60, 0.22), transparent 45%),
          radial-gradient(circle at 82% 80%, rgba(244, 63, 94, 0.2), transparent 48%),
          linear-gradient(135deg, #fff7ed 0%, #ffe4e6 52%, #fef3c7 100%);
        --surface: #ffedd5;
        --surface-elevated: rgba(255, 255, 255, 0.94);
        --ink: #2d1613;
        --ink-muted: #764a42;
        --accent: #e11d48;
        --accent-hover: #be123c;
        --accent-soft: rgba(225, 29, 72, 0.11);
        --accent-contrast: #ffffff;
        --border: rgba(234, 88, 12, 0.18);
        --gold: #d97706;
        --shadow: 0 20px 50px -15px rgba(225, 29, 72, 0.15);
      }

      [data-theme="lavender-blossom"] {
        --bg: #faf5ff;
        --bg-gradient:
          radial-gradient(circle at 14% 18%, rgba(192, 132, 252, 0.22), transparent 45%),
          radial-gradient(circle at 86% 22%, rgba(244, 114, 182, 0.22), transparent 45%),
          radial-gradient(circle at 50% 90%, rgba(253, 224, 71, 0.2), transparent 48%),
          linear-gradient(135deg, #faf5ff 0%, #fdf2f8 55%, #fefce8 100%);
        --surface: #f3e8ff;
        --surface-elevated: rgba(255, 255, 255, 0.94);
        --ink: #261433;
        --ink-muted: #654778;
        --accent: #a21caf;
        --accent-hover: #86198f;
        --accent-soft: rgba(162, 28, 175, 0.11);
        --accent-contrast: #ffffff;
        --border: rgba(162, 28, 175, 0.18);
        --gold: #ca8a04;
        --shadow: 0 20px 50px -15px rgba(162, 28, 175, 0.15);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background-color: var(--bg);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--ink);
        font-family: "Plus Jakarta Sans", "Hind Siliguri", sans-serif;
        line-height: 1.65;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background-color 0.45s ease, color 0.45s ease;
        -webkit-font-smoothing: antialiased;
        caret-color: transparent;
      }

      input,
      textarea,
      select {
        caret-color: auto;
        user-select: text;
        -webkit-user-select: text;
      }

      img,
      canvas,
      button,
      [role="button"],
      [tabindex],
      .stage-screen,
      .couple-stage,
      .collage-wall,
      .intro-invite-card,
      .flower-curtain-stage,
      .portal-arch,
      .museum-door-frame,
      .flip-card,
      .envelope-stage,
      .promise-item {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        outline: none;
      }

      *:focus:not(:focus-visible) {
        outline: none !important;
      }

      .font-serif-display {
        font-family: "Cormorant Garamond", "Noto Serif Bengali", serif;
      }

      .font-prose {
        font-family: "Noto Serif Bengali", "Cormorant Garamond", "Hind Siliguri", serif;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .hidden {
        display: none !important;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Inline PNG icon helpers (zero missing emoji boxes!) */
      .icon-img {
        width: 20px;
        height: 20px;
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .icon-img-md {
        width: 28px;
        height: 28px;
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .icon-img-lg {
        width: 56px;
        height: 56px;
        object-fit: contain;
        display: inline-block;
      }

      #fx-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 45;
      }

      /* =========================================================
         BUTTONS & CONTROLS
         ========================================================= */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.72rem 1.45rem;
        min-height: 44px;
        border-radius: 0.7rem;
        font-size: 0.92rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        border: 1px solid transparent;
        white-space: nowrap;
        flex-shrink: 0;
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        text-decoration: none;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-hover));
        color: var(--accent-contrast);
        box-shadow: 0 8px 20px -6px var(--accent);
      }

      .btn-primary:hover:not(:disabled) {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .btn-secondary {
        background-color: var(--surface-elevated);
        color: var(--ink);
        border-color: var(--border);
      }

      .btn-secondary:hover:not(:disabled) {
        border-color: var(--accent);
      }

      .btn-ghost {
        background-color: transparent;
        color: var(--ink-muted);
      }

      .btn-ghost:hover:not(:disabled) {
        color: var(--ink);
        background-color: var(--accent-soft);
      }

      .btn-sm {
        min-height: 36px;
        padding: 0.42rem 0.85rem;
        font-size: 0.82rem;
      }

      /* =========================================================
         CREATOR MODE LAYOUT
         ========================================================= */
      #creator-app {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .creator-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface-elevated);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 30;
      }

      .brand-wordmark {
        font-family: "Cormorant Garamond", "Noto Serif Bengali", serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        flex-shrink: 0;
      }

      .header-meta {
        font-size: 0.84rem;
        color: var(--ink-muted);
        white-space: nowrap;
      }

      .lang-switch-btn {
        background: linear-gradient(135deg, var(--surface), var(--surface-elevated));
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        padding: 0.42rem 0.95rem;
        font-size: 0.83rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: border-color 0.18s ease, transform 0.16s ease;
      }

      .lang-switch-btn:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .creator-shell {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 1.85rem 1.25rem 4rem;
        flex: 1;
      }

      .step-rail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.45rem;
        margin-bottom: 1.75rem;
        overflow-x: auto;
        padding-bottom: 0.45rem;
      }

      .step-node {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        background: var(--surface-elevated);
        border: 1px solid var(--border);
        cursor: pointer;
        color: var(--ink-muted);
        font-family: inherit;
        font-size: 0.81rem;
        font-weight: 600;
        padding: 0.45rem 0.72rem;
        border-radius: 0.6rem;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }

      .step-node:hover {
        color: var(--ink);
        border-color: var(--accent);
      }

      .step-node.active {
        color: var(--accent-contrast);
        background: var(--accent);
        border-color: var(--accent);
      }

      .step-node.done {
        color: var(--ink);
        border-color: var(--gold);
      }

      .step-num {
        width: 1.45rem;
        height: 1.45rem;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.74rem;
        border: 1px solid currentColor;
        font-variant-numeric: tabular-nums;
      }

      .step-card {
        background-color: var(--surface-elevated);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 1.15rem;
        padding: 2.1rem;
        box-shadow: var(--shadow);
        animation: fadeSlideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @media (max-width: 640px) {
        .step-card {
          padding: 1.35rem;
        }
        .header-meta {
          display: none;
        }
      }

      .step-kicker {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.35rem;
      }

      .step-title {
        font-family: "Cormorant Garamond", "Noto Serif Bengali", serif;
        font-size: clamp(1.75rem, 3.2vw, 2.35rem);
        font-weight: 700;
        line-height: 1.22;
        margin-bottom: 0.45rem;
        text-wrap: balance;
      }

      .step-desc {
        color: var(--ink-muted);
        font-size: 0.94rem;
        margin-bottom: 1.65rem;
        max-width: 64ch;
      }

      .form-grid {
        display: grid;
        gap: 1.35rem;
      }

      .form-row-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }

      .form-row-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.85rem;
      }

      @media (max-width: 640px) {
        .form-row-2,
        .form-row-3 {
          grid-template-columns: 1fr;
        }
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .field-label {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .input,
      .textarea,
      .select {
        width: 100%;
        background-color: var(--bg);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 0.65rem;
        padding: 0.75rem 0.95rem;
        font-size: 0.95rem;
        font-family: inherit;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .input:focus,
      .textarea:focus,
      .select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .textarea {
        resize: vertical;
        min-height: 100px;
        line-height: 1.65;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.7rem;
      }

      @media (max-width: 640px) {
        .choice-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .choice-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
        padding: 0.85rem 1rem;
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        color: var(--ink);
        transition: border-color 0.18s ease, background-color 0.18s ease;
      }

      .choice-card:hover {
        border-color: var(--accent);
      }

      .choice-card.selected {
        background-color: var(--accent-soft);
        border-color: var(--accent);
      }

      .choice-title {
        font-size: 0.9rem;
        font-weight: 600;
      }

      .choice-sub {
        font-size: 0.76rem;
        color: var(--ink-muted);
      }

      .theme-swatch-row {
        display: flex;
        gap: 0.28rem;
        margin-bottom: 0.35rem;
        flex-wrap: wrap;
      }

      .swatch-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(128, 128, 128, 0.28);
      }

      .custom-color-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        padding: 0.85rem 1rem;
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        margin-top: 0.5rem;
      }

      .color-picker-item {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .color-picker-item input[type="color"] {
        width: 34px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        cursor: pointer;
        background: none;
        padding: 1px;
      }

      .days-preview-line {
        font-size: 0.94rem;
        color: var(--accent);
        font-weight: 700;
        padding-top: 0.35rem;
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      /* Photo Upload Zone */
      .dropzone {
        border: 1.5px dashed var(--accent);
        background-color: var(--accent-soft);
        border-radius: 0.95rem;
        padding: 1.75rem 1.25rem;
        text-align: center;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .dropzone:hover,
      .dropzone.dragover {
        background-color: var(--surface);
      }

      .photo-grid-editor {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }

      .photo-item-card {
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 0.65rem;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .photo-thumb-wrap {
        position: relative;
        aspect-ratio: 4 / 3;
        border-radius: 0.5rem;
        overflow: hidden;
        background-color: var(--surface);
      }

      .photo-thumb-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .photo-remove-btn {
        position: absolute;
        top: 0.35rem;
        right: 0.35rem;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(20, 15, 18, 0.8);
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .puzzle-select-btn {
        width: 100%;
        padding: 0.44rem 0.6rem;
        border-radius: 0.45rem;
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--ink);
        font-size: 0.8rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        transition: all 0.16s ease;
      }

      .puzzle-select-btn.active {
        background-color: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
      }

      /* Image-Based Wax Seal & Sticker Pickers */
      .img-picker-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
      }

      .img-pick-btn {
        width: 60px;
        height: 60px;
        border-radius: 0.8rem;
        border: 1.5px solid var(--border);
        background-color: var(--bg);
        padding: 0.45rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
      }

      .img-pick-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .img-pick-btn:hover {
        transform: translateY(-2px);
      }

      .img-pick-btn.selected {
        border-color: var(--accent);
        background-color: var(--accent-soft);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .voice-studio {
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 0.85rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        text-align: center;
      }

      .voice-visualizer {
        width: 100%;
        max-width: 420px;
        height: 64px;
        border-radius: 0.5rem;
        background-color: var(--surface);
      }

      .step-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }

      .result-box {
        background-color: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 0.9rem;
        padding: 1.5rem;
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        animation: fadeSlideUp 0.4s ease;
      }

      .link-display {
        background-color: var(--surface-elevated);
        border: 1px solid var(--border);
        border-radius: 0.55rem;
        padding: 0.75rem 0.95rem;
        font-size: 0.85rem;
        word-break: break-all;
        color: var(--ink);
        user-select: all;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        display: inline-block;
      }

      /* =========================================================
         RECEIVER MODE & INTERACTIVE FLOWER CURTAIN
         ========================================================= */
      #receiver-app {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        width: 100%;
      }

      .receiver-topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.25rem;
        pointer-events: none;
      }

      .receiver-topbar > * {
        pointer-events: auto;
      }

      .topbar-right-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .sound-toggle {
        background-color: var(--surface-elevated);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        padding: 0.45rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        box-shadow: var(--shadow);
      }

      .stage-screen {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4.5rem 1.25rem 3rem;
        position: relative;
      }

      /* Flower Curtain Overlay */
      .flower-curtain-stage {
        position: fixed;
        inset: 0;
        z-index: 55;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }

      .curtain-half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 52%;
        transition: transform 1.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.1s ease;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(5, 1fr);
        place-items: center;
        padding: 1rem;
        pointer-events: none;
      }

      .curtain-left {
        left: 0;
        background: linear-gradient(90deg, rgba(157, 23, 77, 0.94), rgba(219, 39, 119, 0.85), rgba(254, 240, 138, 0.55));
        backdrop-filter: blur(8px);
        border-right: 2px solid rgba(253, 224, 71, 0.55);
      }

      .curtain-right {
        right: 0;
        background: linear-gradient(-90deg, rgba(157, 23, 77, 0.94), rgba(219, 39, 119, 0.85), rgba(254, 240, 138, 0.55));
        backdrop-filter: blur(8px);
        border-left: 2px solid rgba(253, 224, 71, 0.55);
      }

      .curtain-flower-img {
        width: clamp(78px, 16vw, 144px);
        height: clamp(78px, 16vw, 144px);
        object-fit: contain;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.25));
        animation: flowerSway 3.6s ease-in-out infinite alternate;
      }

      .flower-curtain-stage.parted {
        pointer-events: none;
      }

      .flower-curtain-stage.parted .curtain-left {
        transform: translateX(-115%) rotate(-6deg);
        opacity: 0;
      }

      .flower-curtain-stage.parted .curtain-right {
        transform: translateX(115%) rotate(6deg);
        opacity: 0;
      }

      .curtain-prompt-pill {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 250, 245, 0.96);
        color: #7c133b;
        border: 2px solid #fbbf24;
        border-radius: 1rem;
        padding: 1.25rem 1.75rem;
        text-align: center;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.35);
        max-width: 90vw;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }

      .flower-curtain-stage.parted .curtain-prompt-pill {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.85);
      }

      /* Lock Screen */
      .lock-envelope {
        width: 100%;
        max-width: 450px;
        background-color: var(--surface-elevated);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2.3rem 1.85rem;
        box-shadow: var(--shadow);
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .lock-envelope.unlocked {
        transform: scale(1.04) translateY(-12px);
      }

      .lock-flower-top {
        width: 78px;
        height: 78px;
        object-fit: contain;
        margin: 0 auto 0.75rem;
        display: block;
        filter: drop-shadow(0 8px 16px rgba(190, 24, 93, 0.25));
        animation: gentlePulse 2.8s ease-in-out infinite;
      }

      .lock-hint-bar {
        margin-top: 0.95rem;
        padding: 0.6rem 0.9rem;
        border-radius: 0.65rem;
        background-color: var(--surface);
        border: 1px solid var(--border);
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--ink);
        word-break: break-word;
      }

      .password-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-eye-btn {
        position: absolute;
        right: 0.65rem;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 0.35rem 0.5rem;
        color: var(--ink-muted);
      }

      .unlock-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: #16a34a;
        font-weight: 700;
        font-size: 1.05rem;
        margin-top: 0.85rem;
        animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Intro & Couple */
      .intro-invite-card {
        width: 100%;
        max-width: 520px;
        background-color: var(--surface-elevated);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 3rem 2rem;
        text-align: center;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
      }

      .intro-invite-card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
      }

      .couple-stage {
        max-width: 640px;
        text-align: center;
        animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .couple-svg-wrap {
        width: 100%;
        max-width: 340px;
        margin: 0 auto 1.35rem;
      }

      /* Polaroid Collage */
      .collage-wall {
        width: 100%;
        max-width: 1120px;
        margin: 0 auto;
        text-align: center;
        cursor: pointer;
      }

      .polaroid-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
        margin: 2rem 0 2.25rem;
      }

      .polaroid-card {
        width: 195px;
        background: #ffffff;
        color: #241b1e;
        padding: 0.65rem 0.65rem 1.2rem;
        border-radius: 0.4rem;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
        transform: rotate(var(--rot, -2deg));
        animation: floatPolaroid 5.5s ease-in-out infinite;
        animation-delay: var(--delay, 0s);
        transition: transform 0.25s ease;
      }

      .polaroid-card:hover {
        transform: rotate(0deg) scale(1.06);
        z-index: 5;
      }

      .polaroid-card img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 0.22rem;
        display: block;
      }

      .polaroid-caption {
        margin-top: 0.65rem;
        font-family: "Noto Serif Bengali", "Cormorant Garamond", serif;
        font-size: 0.92rem;
        font-weight: 600;
        color: #2c2024;
        line-height: 1.35;
      }

      @media (max-width: 600px) {
        .polaroid-card {
          width: 148px;
          padding: 0.5rem 0.5rem 0.9rem;
        }
      }

      /* Bow & Arrow */
      .bow-stage-wrap {
        width: 100%;
        max-width: 780px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        text-align: center;
      }

      #bow-canvas {
        width: 100%;
        max-width: 720px;
        height: auto;
        aspect-ratio: 720 / 360;
        background-color: var(--surface-elevated);
        border: 1px solid var(--border);
        border-radius: 1.1rem;
        box-shadow: var(--shadow);
        touch-action: none;
        cursor: grab;
      }

      .first-msg-reveal {
        background-color: var(--surface-elevated);
        border: 1px solid var(--accent);
        border-radius: 1rem;
        padding: 1.75rem 2rem;
        max-width: 620px;
        box-shadow: var(--shadow);
        animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Heart Tree */
      #tree-canvas {
        width: 100%;
        max-width: 660px;
        height: auto;
        aspect-ratio: 660 / 410;
        border-radius: 1.1rem;
        background: linear-gradient(180deg, var(--surface-elevated) 0%, var(--surface) 100%);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      /* =========================================================
         MODERN ARCHITECTURAL MUSEUM DOORS
         ========================================================= */
      .doors-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
        max-width: 580px;
        width: 100%;
      }

      .portal-arch {
        position: relative;
        padding: 18px 18px 0;
        border-radius: 175px 175px 10px 10px;
        background: linear-gradient(160deg, #f3e2c7, #c9a362, #8c6429);
        box-shadow: 0 28px 65px -16px rgba(60, 20, 35, 0.45), inset 0 2px 10px rgba(255, 255, 255, 0.65);
        cursor: pointer;
        user-select: none;
      }

      .museum-door-frame {
        position: relative;
        width: 300px;
        height: 375px;
        perspective: 1400px;
        border-radius: 155px 155px 4px 4px;
        overflow: visible;
        background: #1a0910;
      }

      .door-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #fffbe0 0%, #fbbf24 45%, rgba(245, 158, 11, 0.1) 80%);
        opacity: 0;
        transition: opacity 0.9s ease;
        border-radius: 155px 155px 4px 4px;
        box-shadow: 0 0 80px rgba(253, 224, 71, 0.75);
      }

      .museum-door-frame.opening .door-glow {
        opacity: 1;
      }

      .door-leaf {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, transparent 45%),
          linear-gradient(145deg, #5d1735 0%, #3b0d21 60%, #270715 100%);
        border: 2px solid #e7c275;
        transition: transform 1.25s cubic-bezier(0.22, 1, 0.36, 1);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 16px;
        box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.45);
      }

      .door-left {
        left: 0;
        border-top-left-radius: 155px;
        transform-origin: left center;
        align-items: flex-end;
      }

      .door-right {
        right: 0;
        border-top-right-radius: 155px;
        transform-origin: right center;
        align-items: flex-start;
      }

      .door-inlay {
        width: 78%;
        height: 62%;
        border: 1.5px solid rgba(231, 194, 117, 0.48);
        border-radius: 70px 70px 6px 6px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .door-knob {
        position: absolute;
        top: 50%;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff8d6, #d97706);
        border: 1px solid #fff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
        transform: translateY(-50%);
      }

      .door-left .door-knob {
        right: -24px;
      }
      .door-right .door-knob {
        left: -24px;
      }

      .door-center-crest {
        position: absolute;
        top: 44%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.94);
        border: 2px solid #e7c275;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      .door-center-crest img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .museum-door-frame.opening .door-center-crest {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.4);
      }

      .knock-ripple {
        position: absolute;
        top: 44%;
        left: 50%;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 2px solid #fde047;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: none;
        z-index: 6;
        animation: knockRipple 0.65s ease-out forwards;
      }

      .museum-door-frame.knocked {
        animation: doorShake 0.28s ease;
      }

      .museum-door-frame.opening .door-left {
        transform: rotateY(-112deg);
      }

      .museum-door-frame.opening .door-right {
        transform: rotateY(112deg);
      }

      /* Museum Rooms */
      .museum-shell {
        width: 100%;
        max-width: 1060px;
        margin: 0 auto;
        padding: 4.5rem 1.25rem 4rem;
      }

      .museum-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .room-tabs {
        display: flex;
        gap: 0.45rem;
        overflow-x: auto;
      }

      .room-tab {
        background: var(--surface-elevated);
        border: 1px solid var(--border);
        color: var(--ink-muted);
        border-radius: 0.55rem;
        padding: 0.45rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: all 0.18s ease;
      }

      .room-tab.active {
        background-color: var(--accent);
        color: var(--accent-contrast);
        border-color: var(--accent);
      }

      .scratch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 1.35rem;
      }

      .scratch-frame {
        background-color: var(--surface-elevated);
        border: 1px solid var(--border);
        border-radius: 0.85rem;
        padding: 0.75rem;
        box-shadow: var(--shadow);
      }

      .scratch-canvas-box {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: 0.5rem;
        overflow: hidden;
        background-color: var(--surface);
      }

      .scratch-canvas-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .scratch-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
        transition: opacity 0.45s ease;
      }

      .scratch-caption {
        margin-top: 0.65rem;
        font-size: 0.9rem;
        font-family: "Noto Serif Bengali", "Cormorant Garamond", serif;
        text-align: center;
        color: var(--ink);
      }

      .puzzle-board {
        width: min(360px, 90vw);
        height: min(360px, 90vw);
        margin: 1.5rem auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
        background-color: var(--surface);
        padding: 6px;
        border-radius: 0.85rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .puzzle-tile {
        width: 100%;
        height: 100%;
        border-radius: 0.4rem;
        background-size: 300% 300%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
      }

      .puzzle-tile.selected {
        border-color: var(--accent);
        transform: scale(0.94);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .puzzle-fullscreen-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(18, 8, 14, 0.94);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        padding: 1.5rem;
        text-align: center;
        animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .puzzle-fullscreen-img {
        max-width: 94vw;
        max-height: 74vh;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 0.95rem;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
        border: 2px solid rgba(253, 224, 71, 0.45);
      }

      .notes-wall-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.25rem;
      }

      .flip-card {
        height: 220px;
        perspective: 1000px;
        cursor: pointer;
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        transform-style: preserve-3d;
      }

      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }

      .flip-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 0.9rem;
        border: 1px solid var(--border);
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .flip-front {
        background: linear-gradient(155deg, var(--surface-elevated), var(--surface));
      }

      .flip-back {
        background-color: var(--surface-elevated);
        transform: rotateY(180deg);
        font-family: "Noto Serif Bengali", "Cormorant Garamond", serif;
        font-size: 1rem;
        line-height: 1.65;
      }

      /* =========================================================
         ROOM 4: 3D INTERACTIVE ENVELOPE + WAX SEAL + LETTER REVEAL
         ========================================================= */
      .reading-room-wrap {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .envelope-stage {
        position: relative;
        width: 100%;
        max-width: 460px;
        height: 300px;
        margin: 1.5rem auto 0.5rem;
        perspective: 1200px;
        cursor: pointer;
        user-select: none;
      }

      .env-back {
        position: absolute;
        inset: 0;
        background: linear-gradient(165deg, #f3e4d7, #e6cfb8);
        border-radius: 0.9rem;
        border: 1px solid rgba(157, 23, 77, 0.22);
        box-shadow: var(--shadow);
      }

      .env-inner-sheet {
        position: absolute;
        left: 6%;
        right: 6%;
        top: 14%;
        bottom: 10%;
        background: #efe0d1;
        border-radius: 0.65rem;
        padding: 1.25rem;
        border: 1px solid rgba(110, 71, 48, 0.25);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, opacity 0.6s ease;
        z-index: 2;
        overflow: hidden;
      }

      .env-front-pocket {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        border-radius: 0.9rem;
        overflow: hidden;
      }

      .env-front-pocket::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(155deg, #fff9f2, #f5e5d5);
        clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
        border-radius: 0.9rem;
      }

      .env-front-pocket::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(190, 24, 93, 0.06), rgba(157, 23, 77, 0.12));
        clip-path: polygon(0 100%, 50% 48%, 100% 100%);
      }

      .env-top-flap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 58%;
        background: linear-gradient(180deg, #fffcf7, #f1decb);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top center;
        transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 4;
        border-top-left-radius: 0.9rem;
        border-top-right-radius: 0.9rem;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
      }

      .env-wax-seal {
        position: absolute;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        width: 86px;
        height: 86px;

        opacity: 0;

      .letter-sticker-img {
        position: absolute;
        top: 1.15rem;
        right: 1.35rem;

        height: 64px;
        object-fit: contain;
        transform: rotate(7deg);

          transparent 0px,

        display: flex;

        flex: 1;

        flex: 1;

        border-radius: 2px;
        height: 25%;

      .waveform-bars.playing .wave-bar {
        opacity: 1;
        animation: waveBounce 0.8s ease-in-out infinite alternate;
      }

      .promises-parchment {
        max-width: 680px;
        margin: 0 auto;
        background-color: var(--surface-elevated);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.25rem 2rem 3.5rem;

        position: absolute;
        bottom: 1.5rem;
        right: 1.75rem;

        font-size: 1.65rem;
        letter-spacing: 0.16em;

        pointer-events: none;

      .sealed-stamp.stamped {
        animation: stampSlam 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;

        max-width: 680px;

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }

      @keyframes letterUnfold {
        from { opacity: 0; transform: translateY(28px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.86); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes gentlePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes flowerSway {
        0% { transform: translateY(-4px) rotate(-6deg) scale(0.96); }
        100% { transform: translateY(6px) rotate(6deg) scale(1.04); }
      }
      @keyframes floatPolaroid {
        0%, 100% { transform: rotate(var(--rot, -2deg)) translateY(0px); }
        50% { transform: rotate(calc(var(--rot, -2deg) * -0.5)) translateY(-10px); }
      }
      @keyframes doorShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px) rotate(-0.8deg); }
        75% { transform: translateX(6px) rotate(0.8deg); }
      }
      @keyframes knockRipple {
        from { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
        to { opacity: 0; transform: translate(-50%, -50%) scale(3.1); }
      }
      @keyframes stampSlam {
        0% { opacity: 0; transform: rotate(-12deg) scale(2.5); }
        70% { opacity: 1; transform: rotate(-12deg) scale(0.92); }
        100% { opacity: 0.92; transform: rotate(-12deg) scale(1); }
      }
      @keyframes waveBounce {
        0% { height: 20%; }
        100% { height: 92%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

        function toArr(val) {
          if (Array.isArray(val)) return val.filter((item) => item !== null && item !== undefined);
          if (val && typeof val === "object") return Object.values(val).filter((item) => item !== null && item !== undefined);
          return [];
        }

        function isImgReady(im) {
          return !!(im && im.complete && im.naturalWidth > 0);
        }

        async function withTimeout(promise, ms = 6500) {
          let timerId;
          const timeoutPromise = new Promise((_, reject) => {
            timerId = setTimeout(() => reject(new Error("Request timeout")), ms);
          });
          try {
            return await Promise.race([promise, timeoutPromise]);
          } finally {
            clearTimeout(timerId);
          }
        }

        async function saveGiftRecord(giftId, payload) {
          const restUrl = `${firebaseConfig.databaseURL}/gifts/${encodeURIComponent(giftId)}.json`;
          if (firebaseDb) {
            try {
              await withTimeout(firebaseDb.ref(`gifts/${giftId}`).set(payload), 7000);
              return;
            } catch (err) {
              console.warn("Firebase SDK save fallback to REST:", err.message || err);
            }
          }
          const res = await withTimeout(
            fetch(restUrl, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }),
            10000
          );
          if (!res.ok) {
            throw new Error(`Firebase save failed (${res.status})`);
          }
        }

        async function loadGiftRecord(giftId) {
          const restUrl = `${firebaseConfig.databaseURL}/gifts/${encodeURIComponent(giftId)}.json`;
          if (firebaseDb) {
            try {
              const snap = await withTimeout(firebaseDb.ref(`gifts/${giftId}`).once("value"), 5500);
              if (snap && snap.exists()) return snap.val();
            } catch (err) {
              console.warn("Firebase SDK read fallback to REST:", err.message || err);
            }
          }
          const res = await withTimeout(fetch(restUrl), 8000);
          if (!res.ok) return null;
          const data = await res.json();
          return data || null;
        }

        // =========================================================
        // SUPABASE UPLOAD, DELETE & 7-DAY AUTO-EXPIRY CLEANUP
        // =========================================================
        async function uploadToSupabaseBucket(bucket, objectPath, blob) {
          const base = SUPABASE_URL.replace(/\/$/, "");
          const uploadUrl = `${base}/storage/v1/object/${bucket}/${objectPath}`;
          const res = await fetch(uploadUrl, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              apikey: SUPABASE_ANON_KEY,
              "Content-Type": blob.type || "application/octet-stream",
              "x-upsert": "true"
            },
            body: blob
          });
          if (!res.ok) {
            const errTxt = await res.text();
            throw new Error(`Supabase (${bucket}) upload failed: ${res.status} ${errTxt}`);
          }
          return `${base}/storage/v1/object/public/${bucket}/${objectPath}`;
        }

        async function deleteFromSupabaseBucket(bucket, paths) {
          if (!paths || !paths.length) return;
          const base = SUPABASE_URL.replace(/\/$/, "");
          try {
            await fetch(`${base}/storage/v1/object/${bucket}`, {
              method: "DELETE",
              headers: {
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                apikey: SUPABASE_ANON_KEY,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ prefixes: paths })
            });
          } catch (err) {
            console.warn("Supabase delete warning:", err);
          }
        }

        async function deleteGiftAndMedia(giftId, giftRecord) {
          if (giftRecord && giftRecord.storagePaths) {
            const imgPaths = giftRecord.storagePaths.imgPaths || [];
            const voiPath = giftRecord.storagePaths.voiPath || "";
            if (imgPaths.length) await deleteFromSupabaseBucket(SUPABASE_IMG_BUCKET, imgPaths);
            if (voiPath) await deleteFromSupabaseBucket(SUPABASE_VOI_BUCKET, [voiPath]);
          }
          if (firebaseDb) {
            try {
              await firebaseDb.ref(`gifts/${giftId}`).remove();
            } catch (err) {
              console.warn("Firebase delete warning:", err);
            }
          }
        }

        async function runSevenDayAutoCleanup() {
          const now = Date.now();
          if (firebaseDb) {
            try {
              const expiredSnap = await firebaseDb
                .ref("gifts")
                .orderByChild("expiresAt")
                .endAt(now)
                .once("value");
              if (expiredSnap.exists()) {
                const tasks = [];
                expiredSnap.forEach((child) => {
                  tasks.push(deleteGiftAndMedia(child.key, child.val()));
                });
                await Promise.allSettled(tasks);
              }
            } catch (err) {
              console.warn("Firebase expiry sweep skipped:", err.message || err);
            }
          }

          const cutoff = now - SEVEN_DAYS_MS;
          const base = SUPABASE_URL.replace(/\/$/, "");
          for (const [bucket, folder] of [
            [SUPABASE_IMG_BUCKET, SUPABASE_IMG_FOLDER],
            [SUPABASE_VOI_BUCKET, SUPABASE_VOI_FOLDER]
          ]) {
            try {
              const listRes = await fetch(`${base}/storage/v1/object/list/${bucket}`, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                  apikey: SUPABASE_ANON_KEY,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ prefix: `${folder}/`, limit: 200 })
              });
              if (listRes.ok) {
                const items = await listRes.json();
                if (Array.isArray(items)) {
                  const stalePaths = items
                    .filter((item) => item.created_at && new Date(item.created_at).getTime() <= cutoff)
                    .map((item) => `${folder}/${item.name}`);
                  if (stalePaths.length) {
                    await deleteFromSupabaseBucket(bucket, stalePaths);
                  }
                }
              }
            } catch (_) {}
          }
        }

        function compressImageFile(file, maxDim = 1280, quality = 0.85) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            const objUrl = URL.createObjectURL(file);
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              canvas.toBlob(
                (blob) => {
                  URL.revokeObjectURL(objUrl);
                  if (!blob) return reject(new Error("Compression failed"));
                  resolve({ blob, previewUrl: URL.createObjectURL(blob) });
                },
                "image/jpeg",
                quality
              );
            };
            img.onerror = () => {
              URL.revokeObjectURL(objUrl);
              reject(new Error("Image load failed"));
            };
            img.src = objUrl;
          });
        }

              y: Math.random() * fxCanvas.height,
              vx: side * (3.5 + Math.random() * 6),
              vy: 0.8 + Math.random() * 2.2,
              swayPhase: Math.random() * Math.PI * 2,
              size: 62 + Math.random() * 44,
              rot: Math.random() * Math.PI * 2,
              vRot: (Math.random() - 0.5) * 0.06,
              life: 240
            });
          }
          if (!fxAnimId) runFxLoop();
        }

        function runFxLoop() {
          fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

          if (fxMode === "flowers") {
            const activeFlowers = fxParticles.filter((p) => p.type === "flower").length;
            const spawnCount = activeFlowers < 35 ? 3 : activeFlowers < 78 ? 2 : 0;
            for (let s = 0; s < spawnCount; s++) {
              const isPetal = Math.random() < 0.78;
              const img = isPetal
                ? petalImg
                : loadedFlowerImages.length
                  ? loadedFlowerImages[Math.floor(Math.random() * loadedFlowerImages.length)]
                  : petalImg;
              fxParticles.push({
                type: "flower",
                img,
                x: Math.random() * fxCanvas.width,
                y: -30 - Math.random() * 80,
                vx: (Math.random() - 0.5) * 1.4,
                vy: isPetal ? 1.7 + Math.random() * 2.2 : 1.4 + Math.random() * 1.6,
                swayPhase: Math.random() * Math.PI * 2,
                size: isPetal ? 28 + Math.random() * 44 : 52 + Math.random() * 38,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.045,
                life: 820
              });
            }
          }

          for (let i = fxParticles.length - 1; i >= 0; i--) {
            const p = fxParticles[i];
            p.life--;

            if (p.type === "flower") {
              p.swayPhase += 0.025;
              p.x += p.vx + Math.sin(p.swayPhase) * 0.9;
              p.y += p.vy;
              p.rot += p.vRot;

              if (isImgReady(p.img)) {
                fxCtx.save();
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate(p.rot);
                fxCtx.globalAlpha = Math.min(0.95, p.life / 45);
                fxCtx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
                fxCtx.restore();
              } else {
                fxCtx.save();
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate(p.rot);
                fxCtx.globalAlpha = Math.min(0.85, p.life / 45);
                fxCtx.fillStyle = "#e11d48";
                fxCtx.beginPath();
                fxCtx.ellipse(0, 0, p.size * 0.32, p.size * 0.18, 0, 0, Math.PI * 2);
                fxCtx.fill();
                fxCtx.restore();
              }
              if (p.y > fxCanvas.height + 115 || p.life <= 0) fxParticles.splice(i, 1);
            } else if (p.type === "confetti") {
              p.vy += 0.22;
              p.vx *= 0.99;
              p.x += p.vx;
              p.y += p.vy;
              p.rot += p.vRot;

              fxCtx.save();
              fxCtx.translate(p.x, p.y);
              fxCtx.rotate(p.rot);
              fxCtx.globalAlpha = Math.min(1, p.life / 45);
              fxCtx.fillStyle = p.color;
              fxCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.65);
              fxCtx.restore();

              if (p.life <= 0 || p.y > fxCanvas.height + 50) fxParticles.splice(i, 1);
            } else if (p.type === "png") {
              p.vy += 0.14;
              p.x += p.vx;
              p.y += p.vy;
              p.rot += p.vRot;

              if (isImgReady(p.img)) {
                fxCtx.save();
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate(p.rot);
                fxCtx.globalAlpha = Math.min(1, p.life / 35);
                fxCtx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
                fxCtx.restore();
              }
              if (p.life <= 0) fxParticles.splice(i, 1);
            }
          }

          if (fxMode === "flowers" || fxParticles.length > 0) {
            fxAnimId = requestAnimationFrame(runFxLoop);
          } else {
            fxAnimId = null;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
          }
        }

        // =========================================================
        // AUDIO ENGINE: ./m/bgm.mp3 + WEB AUDIO SFX
        // =========================================================
        const bgmAudio = document.getElementById("bgm-audio");
        const SoundEngine = {
          ctx: null,
          isPlaying: false,

          ensureCtx() {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume().catch(() => {});
            }
          },

          startMusic() {
            this.isPlaying = true;
            this.updateToggleUI();
            if (bgmAudio) {
              bgmAudio.volume = 0.5;
              bgmAudio.play().catch(() => {});
            }
          },

          stopMusic() {
            this.isPlaying = false;
            this.updateToggleUI();
            if (bgmAudio) bgmAudio.pause();
          },

          toggle() {
            if (this.isPlaying) this.stopMusic();
            else this.startMusic();
          },

          playKnock() {
            this.ensureCtx();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(145, now);
            osc.frequency.exponentialRampToValueAtTime(52, now + 0.11);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
          },

          playChime() {
            this.ensureCtx();
            if (!this.ctx) return;
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
              const now = this.ctx.currentTime + idx * 0.09;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, now);
              gain.gain.setValueAtTime(0.001, now);
              gain.gain.exponentialRampToValueAtTime(0.09, now + 0.04);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 0.95);
            });
          },

          updateToggleUI() {
            const txt = document.getElementById("sound-text");
            if (!txt) return;
            txt.textContent = this.isPlaying ? "Music On" : "Muted";
          }
        };

        document.getElementById("sound-toggle-btn").addEventListener("click", () => SoundEngine.toggle());

        // 7-day automatic deletion sweep on load
        runSevenDayAutoCleanup();

        const urlParams = new URLSearchParams(window.location.search);

        if (activeGiftId && activeGiftId.trim() !== "") {

        // =========================================================

          // STEP 1
          function renderStep1(container) {

          // STEP 2: Full Date (Day, Month, Year) + Multi-Color Themes & Custom Color Picker

            container.innerHTML = `

          // STEP 3

            function renderPhotoGrid() {

            async function handleFiles(fileList) {
              const files = Array.from(fileList).slice(0, 8 - state.photos.length);
              for (const file of files) {
                if (!file.type.startsWith("image/")) continue;
                try {
                  const { blob, previewUrl } = await compressImageFile(file);
                  state.photos.push({
                    id: `${Date.now()}_${state.photos.length}`,

            dropzone.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

            renderPhotoGrid();
            renderFooter(container);

                <div style="font-size: 0.82rem; color: var(--ink-muted);">

                </div>
                <div id="rec-error" style="color: #dc2626; font-size: 0.85rem;"></div>
              </div>
            `;

            const startBtn = container.querySelector("#rec-start-btn");
            const stopBtn = container.querySelector("#rec-stop-btn");
            const timerLabel = container.querySelector("#rec-timer-label");
            const visCanvas = container.querySelector("#rec-visualizer");
            const visCtx = visCanvas.getContext("2d");
            const errBox = container.querySelector("#rec-error");

            function drawIdleBars() {
              visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
              visCtx.fillStyle = "rgba(219, 39, 119, 0.25)";
              for (let x = 10; x < visCanvas.width - 10; x += 12) {
                const h = 10 + Math.sin(x * 0.08) * 6;
                visCtx.fillRect(x, 32 - h / 2, 6, h);
              }
            }
            drawIdleBars();

            function stopRecordingCleanup() {
              if (recTimer) clearInterval(recTimer);
              if (recAnimId) cancelAnimationFrame(recAnimId);
              if (recAudioCtx) {
                recAudioCtx.close().catch(() => {});
                recAudioCtx = null;
              }
              if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
            }

            startBtn.addEventListener("click", async () => {
              errBox.textContent = "";
              if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                errBox.textContent = "Microphone unavailable. Please upload an audio file instead.";
                return;
              }
              try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recChunks = [];
                recSeconds = 0;
                mediaRecorder = new MediaRecorder(stream);

                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                recAudioCtx = new AudioCtx();
                const src = recAudioCtx.createMediaStreamSource(stream);
                const analyser = recAudioCtx.createAnalyser();
                analyser.fftSize = 64;
                src.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                const drawLive = () => {
                  analyser.getByteFrequencyData(dataArray);
                  visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
                  visCtx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#db2777";
                  const barW = visCanvas.width / dataArray.length;
                  dataArray.forEach((val, i) => {
                    const h = Math.max(4, (val / 255) * (visCanvas.height - 8));
                    visCtx.fillRect(i * barW + 2, (visCanvas.height - h) / 2, Math.max(3, barW - 4), h);
                  });
                  recAnimId = requestAnimationFrame(drawLive);
                };
                drawLive();

                mediaRecorder.ondataavailable = (e) => {
                  if (e.data.size > 0) recChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                  stream.getTracks().forEach((tr) => tr.stop());
                  const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || "audio/webm" });
                  state.voiceBlob = blob;
                  state.voiceUrl = URL.createObjectURL(blob);
                  state.voiceDuration = recSeconds;
                  renderStep5(container);
                };

                mediaRecorder.start();
                startBtn.classList.add("hidden");
                stopBtn.classList.remove("hidden");
                timerLabel.textContent = "00:00 / 00:45";

                recTimer = setInterval(() => {
                  recSeconds++;
                  timerLabel.textContent = `00:${String(recSeconds).padStart(2, "0")} / 00:45`;
                  if (recSeconds >= 45) stopRecordingCleanup();
                }, 1000);
              } catch (err) {
                errBox.textContent = "Microphone permission denied. Allow mic access or upload audio.";
              }
            });

            stopBtn.addEventListener("click", stopRecordingCleanup);

            const delBtn = container.querySelector("#rec-delete-btn");

            stageRoot.innerHTML = `
