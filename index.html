            const canvas = stageRoot.querySelector("#bow-canvas");
            const ctx = canvas.getContext("2d");
            const quickBtn = stageRoot.querySelector("#quick-shoot-btn");
            const msgBox = stageRoot.querySelector("#first-msg-box");
            const toTreeBtn = stageRoot.querySelector("#to-tree-btn");
            const loveImg = imageCache["./img/love.png"] || preloadImg("./img/love.png");

            let pulling = false;
            let pullAmount = 0;
            let arrowFired = false;
            let arrowHit = false;
            let arrowX = 125;
            const arrowY = 180;
            let arrowVx = 0;
            let heartPulse = 0;
            const targetX = 565;
            const targetY = 180;
            let animId = null;

            function launchArrow(power = 55) {
              if (arrowFired) return;
              arrowFired = true;
              arrowVx = 12 + power * 0.18;
              pullAmount = 0;
              quickBtn.classList.add("hidden");
            }

            function getPos(e) {
              const rect = canvas.getBoundingClientRect();
              return {
                x: ((e.clientX - rect.left) / rect.width) * canvas.width,
                y: ((e.clientY - rect.top) / rect.height) * canvas.height
              };
            }

            canvas.addEventListener("pointerdown", (e) => {
              if (arrowFired) return;
              pulling = true;
              try {
                canvas.setPointerCapture(e.pointerId);
              } catch (_) {}
              pullAmount = Math.max(15, Math.min(68, 160 - getPos(e).x));
            });
            canvas.addEventListener("pointermove", (e) => {
              if (!pulling || arrowFired) return;
              pullAmount = Math.max(10, Math.min(68, 165 - getPos(e).x));
            });
            function releaseBow() {
              if (!pulling || arrowFired) return;
              pulling = false;
              launchArrow(Math.max(42, pullAmount));
            }
            canvas.addEventListener("pointerup", releaseBow);
            canvas.addEventListener("pointercancel", releaseBow);
            quickBtn.addEventListener("click", () => launchArrow(58));

            function drawFallbackHeart(cx, cy, size, fill) {
              ctx.save();
              ctx.translate(cx, cy);
              ctx.fillStyle = fill;
              ctx.beginPath();
              ctx.moveTo(0, size * 0.35);
              ctx.bezierCurveTo(-size * 0.65, -size * 0.15, -size * 0.45, -size * 0.65, 0, -size * 0.25);
              ctx.bezierCurveTo(size * 0.45, -size * 0.65, size * 0.65, -size * 0.15, 0, size * 0.35);
              ctx.fill();
              ctx.restore();
            }

            function drawBowScene() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              heartPulse += 0.05;
              const accentColor = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#db2777";
              const inkColor = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#2c101b";

              // Target love.png floating heart
              if (!arrowHit) {
                const s = 1 + Math.sin(heartPulse) * 0.06;
                const ty = targetY + Math.sin(heartPulse * 0.7) * 8;
                ctx.save();
                ctx.translate(targetX, ty);
                ctx.scale(s, s);
                ctx.shadowColor = accentColor;
                ctx.shadowBlur = 24;
                if (isImgReady(loveImg)) {
                  ctx.drawImage(loveImg, -48, -48, 96, 96);
                } else {
                  drawFallbackHeart(0, 8, 86, accentColor);
                }
                ctx.restore();
              }

              const bowX = 125;
              const bowY = 180;
              const stringPullX = bowX - 18 - (arrowFired ? 0 : pullAmount);

              ctx.strokeStyle = inkColor;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(bowX - 10, bowY - 72);
              ctx.lineTo(stringPullX, bowY);
              ctx.lineTo(bowX - 10, bowY + 72);
              ctx.stroke();

              ctx.strokeStyle = "#d97706";
              ctx.lineWidth = 7;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(bowX - 10, bowY - 72);
              ctx.quadraticCurveTo(bowX + 42, bowY, bowX - 10, bowY + 72);
              ctx.stroke();

              if (arrowFired && !arrowHit) {
                arrowX += arrowVx;
                if (arrowX >= targetX - 30) {
                  arrowHit = true;
                  SoundEngine.playChime();
                  const rect = canvas.getBoundingClientRect();
                  triggerImageBurst(
                    rect.left + (targetX / canvas.width) * rect.width,
                    rect.top + (targetY / canvas.height) * rect.height,
                    80
                  );
                  msgBox.classList.remove("hidden");
                }
              }

              if (!arrowHit) {
                const drawAX = arrowFired ? arrowX : stringPullX;
                ctx.strokeStyle = accentColor;
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(drawAX, arrowY);
                ctx.lineTo(drawAX + 78, arrowY);
                ctx.stroke();

                // Shoot with love.png at the tip of the arrow!
                if (isImgReady(loveImg)) {
                  ctx.drawImage(loveImg, drawAX + 70, arrowY - 14, 28, 28);
                } else {
                  drawFallbackHeart(drawAX + 84, arrowY + 2, 24, accentColor);
                }
                animId = requestAnimationFrame(drawBowScene);
              } else {
                if (isImgReady(loveImg)) {
                  ctx.drawImage(loveImg, canvas.width / 2 - 44, canvas.height / 2 - 58, 88, 88);
                } else {
                  drawFallbackHeart(canvas.width / 2, canvas.height / 2 - 12, 76, accentColor);
                }
                ctx.fillStyle = accentColor;
                ctx.font = "600 26px Georgia, serif";
                ctx.textAlign = "center";
                ctx.fillText("Bullseye!", canvas.width / 2, canvas.height / 2 + 56);
              }
            }
            drawBowScene();

            toTreeBtn.addEventListener("click", () => {
              if (animId) cancelAnimationFrame(animId);
              showHeartTree();
            });
          }

          // STAGE 5: Growing Blossom Tree (Uses PNG Flowers: blossom.png, rose.png, lotus.png, marigold.png)
          function showHeartTree() {
            currentViewFn = showHeartTree;
            stageRoot.innerHTML = `
              <section class="stage-screen">
                <div style="width: 100%; max-width: 700px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.25rem;">
                  <div style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; display:flex; align-items:center; gap:0.45rem;">
                    <span>Always You</span>
                    <img src="./img/blossom.png" alt="" class="icon-img" />
                  </div>
                  <h2 class="font-serif-display" style="font-size: clamp(1.85rem, 4vw, 2.6rem);">
                    It's always been you
                  </h2>
                  <canvas id="tree-canvas" width="660" height="410"></canvas>
                  <button type="button" id="to-doors-btn" class="btn btn-primary">${t("next")} →</button>
                </div>
              </section>
            `;

            const canvas = stageRoot.querySelector("#tree-canvas");
            const ctx = canvas.getContext("2d");
            const branches = [];
            const blossoms = [];
            const blossomSources = ["./img/blossom.png", "./img/rose.png", "./img/lotus.png", "./img/marigold.png", "./img/love.png"];

            function buildBranch(x, y, len, angle, depth, delay) {
              if (depth === 0) {
                for (let k = 0; k < 3; k++) {
                  const src = blossomSources[Math.floor(Math.random() * blossomSources.length)];
                  blossoms.push({
                    x: x + (Math.random() - 0.5) * 38,
                    y: y + (Math.random() - 0.5) * 34,
                    img: imageCache[src] || preloadImg(src),
                    size: 26 + Math.random() * 18,
                    delay: delay + 0.15 + Math.random() * 0.5,
                    sway: Math.random() * Math.PI * 2,
                    rot: (Math.random() - 0.5) * 0.8
                  });
                }
                return;
              }
              const x2 = x + Math.cos(angle) * len;
              const y2 = y + Math.sin(angle) * len;
              branches.push({ x1: x, y1: y, x2, y2, width: depth * 2.1, delay });
              buildBranch(x2, y2, len * 0.74, angle - 0.36 - Math.random() * 0.12, depth - 1, delay + 0.16);
              buildBranch(x2, y2, len * 0.74, angle + 0.36 + Math.random() * 0.12, depth - 1, delay + 0.16);
            }
            buildBranch(330, 385, 86, -Math.PI / 2, 6, 0);

            let startTime = null;
            let treeAnimId = null;

            function animateTree(ts) {
              if (!startTime) startTime = ts;
              const elapsed = (ts - startTime) / 1000;
              ctx.clearRect(0, 0, canvas.width, canvas.height);

              ctx.fillStyle = "rgba(157, 23, 77, 0.12)";
              ctx.beginPath();
              ctx.ellipse(330, 392, 160, 18, 0, 0, Math.PI * 2);
              ctx.fill();

              ctx.strokeStyle = "#6b2d3c";
              ctx.lineCap = "round";
              for (const b of branches) {
                const p = Math.max(0, Math.min(1, (elapsed - b.delay) / 0.35));
                if (p <= 0) continue;
                ctx.lineWidth = b.width;
                ctx.beginPath();
                ctx.moveTo(b.x1, b.y1);
                ctx.lineTo(b.x1 + (b.x2 - b.x1) * p, b.y1 + (b.y2 - b.y1) * p);
                ctx.stroke();
              }

              // Blooming PNG flowers!
              for (const bl of blossoms) {
                const p = Math.max(0, Math.min(1, (elapsed - bl.delay) / 0.45));
                if (p <= 0) continue;
                ctx.save();
                const bob = Math.sin(elapsed * 2 + bl.sway) * 2.5;
                ctx.translate(bl.x, bl.y + bob);
                ctx.rotate(bl.rot + Math.sin(elapsed + bl.sway) * 0.08);
                ctx.scale(p, p);
                if (isImgReady(bl.img)) {
                  ctx.drawImage(bl.img, -bl.size / 2, -bl.size / 2, bl.size, bl.size);
                } else {
                  ctx.fillStyle = "#f472b6";
                  ctx.beginPath();
                  ctx.arc(0, 0, bl.size * 0.34, 0, Math.PI * 2);
                  ctx.fill();
                }
                ctx.restore();
              }

              treeAnimId = requestAnimationFrame(animateTree);
            }
            treeAnimId = requestAnimationFrame(animateTree);

            stageRoot.querySelector("#to-doors-btn").addEventListener("click", () => {
              if (treeAnimId) cancelAnimationFrame(treeAnimId);
              showMuseumDoors();
            });
          }

          // STAGE 6A: Modern Arched Museum Doors
          function showMuseumDoors() {
            currentViewFn = showMuseumDoors;
            let knocks = 0;
            stageRoot.innerHTML = `
              <section class="stage-screen">
                <div class="doors-stage">
                  <div style="font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 700;">
                    Private Exhibition
                  </div>
                  <h2 class="font-serif-display" style="font-size: clamp(2rem, 4.5vw, 2.8rem); line-height: 1.2;">
                    The Museum of ${escapeHtml(giftData.herName)}
                  </h2>
                  <p id="knock-prompt" style="color: var(--ink-muted); font-size: 1rem;">
                    ${t("knockText", 0)}
                  </p>

                  <div class="portal-arch" id="portal-arch">
                    <div id="museum-doors" class="museum-door-frame" role="button" tabindex="0">
                      <div class="door-glow"></div>
                      <div class="door-leaf door-left">
                        <div class="door-inlay"><div class="door-knob"></div></div>
                      </div>
                      <div class="door-leaf door-right">
                        <div class="door-inlay"><div class="door-knob"></div></div>
                      </div>
                      <div class="door-center-crest">
                        <img src="./img/love.png" alt="Door Crest" />
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            `;

            const doors = stageRoot.querySelector("#museum-doors");
            const portal = stageRoot.querySelector("#portal-arch");
            const promptTxt = stageRoot.querySelector("#knock-prompt");

            function handleKnock() {
              if (knocks >= 3) return;
              knocks++;
              SoundEngine.playKnock();
              doors.classList.remove("knocked");
              void doors.offsetWidth;
              doors.classList.add("knocked");
              promptTxt.textContent = t("knockText", knocks);

              const ripple = document.createElement("div");
              ripple.className = "knock-ripple";
              doors.appendChild(ripple);
              setTimeout(() => ripple.remove(), 700);

              if (knocks === 3) {
                SoundEngine.playChime();
                doors.classList.add("opening");
                const rect = doors.getBoundingClientRect();
                triggerImageBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 56);

                  stopLargeFlowerRain();
                  showMuseumRoom(1);

            portal.addEventListener("click", handleKnock);
            doors.addEventListener("keydown", (e) => {

                handleKnock();

            });

          // STAGE 6B: 5 Museum Rooms
          function showMuseumRoom(roomNum) {
            currentViewFn = () => showMuseumRoom(roomNum);
            const roomTitles = ["1 · Gallery", "2 · Puzzle", "3 · Note Wall", "4 · Reading Room", "5 · Promises"];

            stageRoot.innerHTML = `
              <section class="museum-shell">
                <nav class="museum-nav">
                  <div class="room-tabs">
                    ${roomTitles
                      .map((title, idx) => `<button type="button" class="room-tab ${roomNum === idx + 1 ? "active" : ""}" data-room="${idx + 1}">${title}</button>`)
                      .join("")}
                  </div>
                  <div style="font-size: 0.84rem; color: var(--ink-muted); font-weight: 600;">Room ${roomNum} of 5</div>
                </nav>
                <div id="room-content"></div>
              </section>
            `;

            stageRoot.querySelectorAll(".room-tab").forEach((tab) => {
              tab.addEventListener("click", () => showMuseumRoom(Number(tab.dataset.room)));
            });

            const rc = stageRoot.querySelector("#room-content");
            if (roomNum === 1) renderRoom1Gallery(rc);
            else if (roomNum === 2) renderRoom2Puzzle(rc);
            else if (roomNum === 3) renderRoom3NoteWall(rc);
            else if (roomNum === 4) renderRoom4ReadingRoom(rc);
            else if (roomNum === 5) renderRoom5Promises(rc);
          }

          function renderRoom1Gallery(root) {
            const photos = giftData.photos || [];
            if (photos.length === 0) {
              root.innerHTML = `<div style="text-align:center; padding: 3rem;"><p style="color: var(--ink-muted); margin-bottom:1.5rem;">No photographs were added to the gallery.</p><button type="button" id="next-room-btn" class="btn btn-primary">Enter Room 2 →</button></div>`;
              root.querySelector("#next-room-btn").addEventListener("click", () => showMuseumRoom(2));
              return;
            }

            root.innerHTML = `
              <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700;">Room 01 · The Gallery</div>
                <h2 class="font-serif-display" style="font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0.25rem 0;">Scratch the gold foil to reveal</h2>
                <button type="button" id="reveal-all-scratch" class="btn btn-secondary btn-sm" style="margin-top:0.5rem;">Reveal All</button>
              </div>
              <div class="scratch-grid">
                ${photos
                  .map(
                    (ph, idx) => `
                    <figure class="scratch-frame">
                      <div class="scratch-canvas-box">
                        <img src="${escapeHtml(ph.url)}" alt="${escapeHtml(ph.caption)}" />
                        <canvas class="scratch-overlay" width="320" height="240"></canvas>
                      </div>
                      <figcaption class="scratch-caption">Fig. ${idx + 1} ${ph.caption ? "— " + escapeHtml(ph.caption) : ""}</figcaption>
                    </figure>
                  `
                  )
                  .join("")}
              </div>
              <div style="text-align: center; margin-top: 2.5rem;">
                <button type="button" id="next-room-btn" class="btn btn-primary">Enter Room 2 →</button>
              </div>
            `;

            const canvases = root.querySelectorAll(".scratch-overlay");
            canvases.forEach((canvas) => {
              const ctx = canvas.getContext("2d");
              const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
              grad.addColorStop(0, "#d97706");
              grad.addColorStop(0.5, "#fde047");
              grad.addColorStop(1, "#b45309");
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              ctx.fillStyle = "rgba(70, 20, 40, 0.72)";
              ctx.font = "600 18px Georgia, serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("Scratch Gold Foil", canvas.width / 2, canvas.height / 2);

              let scratching = false;
              let cleared = false;
              let strokes = 0;

              function scratchAt(cx, cy) {
                if (cleared) return;
                const rect = canvas.getBoundingClientRect();
                const x = ((cx - rect.left) / rect.width) * canvas.width;
                const y = ((cy - rect.top) / rect.height) * canvas.height;
                ctx.globalCompositeOperation = "destination-out";
                ctx.beginPath();
                ctx.arc(x, y, 26, 0, Math.PI * 2);
                ctx.fill();
                strokes++;
                if (strokes > 26 && strokes % 6 === 0) {
                  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                  let transparent = 0;
                  for (let i = 3; i < data.length; i += 16) if (data[i] === 0) transparent++;
                  if (transparent / (data.length / 16) > 0.45) {
                    cleared = true;
                    canvas.style.opacity = "0";
                    canvas.style.pointerEvents = "none";
                  }
                }
              }

              canvas.addEventListener("pointerdown", (e) => {
                scratching = true;
                try {
                  canvas.setPointerCapture(e.pointerId);
                } catch (_) {}
                scratchAt(e.clientX, e.clientY);
              });
              canvas.addEventListener("pointermove", (e) => {
                if (scratching) scratchAt(e.clientX, e.clientY);
              });
              canvas.addEventListener("pointerup", () => (scratching = false));
              canvas.addEventListener("pointercancel", () => (scratching = false));
            });

            root.querySelector("#reveal-all-scratch").addEventListener("click", () => {
              canvases.forEach((c) => {
                c.style.opacity = "0";
                c.style.pointerEvents = "none";
              });
            });
            root.querySelector("#next-room-btn").addEventListener("click", () => showMuseumRoom(2));
          }

          function renderRoom2Puzzle(root) {
            const photos = giftData.photos || [];
            const puzzlePhoto = photos[giftData.puzzleIndex || 0] || photos[0];
            if (!puzzlePhoto) {
              root.innerHTML = `<div style="text-align:center; padding: 3rem;"><p style="color: var(--ink-muted); margin-bottom:1.5rem;">No puzzle photo selected.</p><button type="button" id="next-room-3-btn" class="btn btn-primary">Enter Room 3 →</button></div>`;
              root.querySelector("#next-room-3-btn").addEventListener("click", () => showMuseumRoom(3));
              return;
            }

            let order = [0, 1, 2, 3, 4, 5, 6, 7, 8];
            for (let i = order.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [order[i], order[j]] = [order[j], order[i]];
            }
            if (order.every((v, i) => v === i)) [order[0], order[1]] = [order[1], order[0]];

            let selectedPos = null;
            let solved = false;
            let moves = 0;

            root.innerHTML = `
              <div style="text-align: center;">
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700;">Room 02 · Restoration Desk</div>
                <h2 class="font-serif-display" style="font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0.25rem 0;">Restore the photograph</h2>
                <p style="color: var(--ink-muted); font-size: 0.92rem;">Tap two tiles to swap them. <span id="puzzle-moves" class="tabular-nums" style="font-weight: 700; color: var(--ink);">Moves: 0</span></p>
                <div id="puzzle-board" class="puzzle-board"></div>
                <div id="puzzle-status" style="min-height: 1.5rem; font-weight: 700; color: var(--accent);"></div>
                <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1.25rem;">
                  <button type="button" id="auto-restore-btn" class="btn btn-secondary btn-sm">Auto-Restore</button>
                  <button type="button" id="next-room-3-btn" class="btn btn-primary">Enter Room 3 →</button>
                </div>
              </div>
            `;

            const board = root.querySelector("#puzzle-board");
            const movesEl = root.querySelector("#puzzle-moves");
            const statusEl = root.querySelector("#puzzle-status");

            function renderTiles() {
              board.innerHTML = order
                .map((pieceIdx, posIdx) => {
                  const bgX = (pieceIdx % 3) * 50;
                  const bgY = Math.floor(pieceIdx / 3) * 50;
                  return `<button type="button" class="puzzle-tile ${selectedPos === posIdx ? "selected" : ""}" data-pos="${posIdx}" style="background-image: url('${puzzlePhoto.url}'); background-position: ${bgX}% ${bgY}%;"></button>`;
                })
                .join("");

              board.querySelectorAll(".puzzle-tile").forEach((tile) => {
                tile.addEventListener("click", () => {
                  if (solved) return;
                  const pos = Number(tile.dataset.pos);
                  if (selectedPos === null) selectedPos = pos;
                  else if (selectedPos === pos) selectedPos = null;
                  else {
                    [order[selectedPos], order[pos]] = [order[pos], order[selectedPos]];
                    selectedPos = null;
                    moves++;
                    movesEl.textContent = `Moves: ${moves}`;
                  }
                  renderTiles();
                  checkSolved();
                });
              });
            }

            function checkSolved() {
              if (!solved && order.every((v, i) => v === i)) {
                solved = true;
                statusEl.textContent = `Restored! ${puzzlePhoto.caption || ""}`;
                SoundEngine.playChime();
                triggerConfettiBurst(120);

                const oldOverlay = document.getElementById("puzzle-fullscreen-reveal");
                if (oldOverlay) oldOverlay.remove();

                const overlay = document.createElement("div");
                overlay.id = "puzzle-fullscreen-reveal";
                overlay.className = "puzzle-fullscreen-overlay";
                overlay.innerHTML = `
                  <img src="${escapeHtml(puzzlePhoto.url)}" alt="${escapeHtml(puzzlePhoto.caption || "Restored memory")}" class="puzzle-fullscreen-img" />
                  ${puzzlePhoto.caption ? `<div class="font-prose" style="color: #fff6ea; font-size: 1.2rem; max-width: 50ch;">${escapeHtml(puzzlePhoto.caption)}</div>` : ""}
                  <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center;">
                    <button type="button" id="puzzle-fs-close" class="btn btn-secondary">Close</button>
                    <button type="button" id="puzzle-fs-next" class="btn btn-primary">Enter Room 3 →</button>
                  </div>
                `;
                document.body.appendChild(overlay);

                overlay.querySelector("#puzzle-fs-close").addEventListener("click", () => overlay.remove());
                overlay.querySelector("#puzzle-fs-next").addEventListener("click", () => {
                  overlay.remove();
                  showMuseumRoom(3);
                });
                overlay.addEventListener("click", (e) => {
                  if (e.target === overlay) overlay.remove();
                });
              }
            }

            root.querySelector("#auto-restore-btn").addEventListener("click", () => {
              order = [0, 1, 2, 3, 4, 5, 6, 7, 8];
              selectedPos = null;
              renderTiles();
              checkSolved();
            });
            root.querySelector("#next-room-3-btn").addEventListener("click", () => showMuseumRoom(3));
            renderTiles();
          }

          function renderRoom3NoteWall(root) {
            const notes = giftData.notes || [];
            root.innerHTML = `
              <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700;">Room 03 · The Note Wall</div>
                <h2 class="font-serif-display" style="font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0.25rem 0;">Tap each card to read</h2>
              </div>
              <div class="notes-wall-grid">
                ${
                  notes.length
                    ? notes
                        .map(
                          (txt, idx) => `
                        <div class="flip-card" tabindex="0" role="button">
                          <div class="flip-card-inner">
                            <div class="flip-face flip-front">
                              <img src="./img/letter.png" alt="Note" class="icon-img-lg" style="margin-bottom: 0.5rem;" />
                              <div class="font-serif-display" style="font-size: 1.45rem; font-weight: 600;">Note 0${idx + 1}</div>
                              <div style="font-size: 0.8rem; color: var(--ink-muted); margin-top: 0.3rem;">Tap to flip</div>
                            </div>
                            <div class="flip-face flip-back"><p>${escapeHtml(txt)}</p></div>
                          </div>
                        </div>
                      `
                        )
                        .join("")
                    : `<p style="text-align:center; color:var(--ink-muted); grid-column:1/-1;">No notes added.</p>`
                }
              </div>
              <div style="text-align: center; margin-top: 2.5rem;">
                <button type="button" id="next-room-4-btn" class="btn btn-primary">Enter Room 4 →</button>
              </div>
            `;

            root.querySelectorAll(".flip-card").forEach((card) => {
              card.addEventListener("click", () => card.classList.toggle("flipped"));
            });
            root.querySelector("#next-room-4-btn").addEventListener("click", () => showMuseumRoom(4));
          }

          // ROOM 4: 3D Envelope + Wax Seal Break + Smooth Letter Slide-Out & Unfold + Voice Note
          function renderRoom4ReadingRoom(root) {
            let envelopeOpened = false;
            const sealSrc = resolveSealSrc(giftData.waxSeal);
            const stickerSrc = resolveStickerSrc(giftData.sticker);
            const letterContent = giftData.loveLetter && giftData.loveLetter.trim()
              ? giftData.loveLetter
              : "With all my love.";

            root.innerHTML = `
              <div style="text-align: center; margin-bottom: 1rem;">
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700;">Room 04 · The Reading Room</div>
                <h2 class="font-serif-display" style="font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0.25rem 0;">A Letter & A Voice</h2>
              </div>

              <div class="reading-room-wrap">
                <!-- Interactive 3D Envelope -->
                <div id="envelope-stage" class="envelope-stage" role="button" tabindex="0" aria-label="Open sealed letter">
                  <div class="env-back"></div>
                  <div class="env-inner-sheet">
                    <div class="font-prose" style="font-size: 0.92rem; color: #5b3041; line-height: 1.65;">
                      ${escapeHtml(letterContent.slice(0, 140))}${letterContent.length > 140 ? "..." : ""}
                    </div>
                  </div>
                  <div class="env-front-pocket"></div>
                  <div class="env-top-flap"></div>
                  <button type="button" id="break-seal-btn" class="env-wax-seal" aria-label="Break wax seal">
                    <img src="${sealSrc}" alt="Wax Seal" />
                  </button>
                  <div class="env-tap-hint">Tap the wax seal to open for ${escapeHtml(giftData.herName)}</div>
                </div>

                <!-- Full Unfolded Letter Sheet -->
                <article id="opened-letter" class="letter-paper hidden">
                  <img src="${stickerSrc}" alt="Letter Sticker" class="letter-sticker-img" />
                  <div class="letter-body">${escapeHtml(letterContent)}</div>
                </article>

                <div class="voice-player-card">
                  <button type="button" id="voice-play-btn" class="btn btn-primary btn-sm" ${giftData.voiceUrl ? "" : "disabled"}>
                    <img src="./img/mic.png" alt="" class="icon-img" />
                    <span id="voice-btn-label">${giftData.voiceUrl ? "Play Voice Note" : "No Voice Recorded"}</span>
                  </button>
                  <div id="voice-waves" class="waveform-bars">
                    ${Array.from({ length: 24 })
                      .map((_, i) => `<span class="wave-bar" style="animation-delay: ${(i * 0.06).toFixed(2)}s;"></span>`)
                      .join("")}
                  </div>
                  <span id="voice-time" class="tabular-nums" style="font-size: 0.82rem; color: var(--ink-muted);">
                    ${giftData.voiceUrl ? `${giftData.voiceDuration || 0}s` : "0s"}
                  </span>
                  ${giftData.voiceUrl ? `<audio id="gift-voice-audio" src="${escapeHtml(giftData.voiceUrl)}"></audio>` : ""}
                </div>

                <div style="text-align: center; margin-top: 0.75rem;">
                  <button type="button" id="next-room-5-btn" class="btn btn-primary">Enter Room 5 →</button>
                </div>
              </div>
            `;

            const envStage = root.querySelector("#envelope-stage");
            const sealBtn = root.querySelector("#break-seal-btn");
            const letterEl = root.querySelector("#opened-letter");

            function openEnvelope() {
              if (envelopeOpened) return;
              envelopeOpened = true;
              SoundEngine.playChime();
              const rect = envStage.getBoundingClientRect();
              triggerImageBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 36);
              envStage.classList.add("opened");

              // Wait for 3D flap & letter slide-out animation, then smoothly reveal full letter paper
              setTimeout(() => {
                envStage.classList.add("hidden");
                letterEl.classList.remove("hidden");
              }, 950);
            }

            envStage.addEventListener("click", openEnvelope);
            sealBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openEnvelope();
            });
            envStage.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openEnvelope();
              }
            });

            const audioEl = root.querySelector("#gift-voice-audio");
            const playBtn = root.querySelector("#voice-play-btn");
            const btnLabel = root.querySelector("#voice-btn-label");
            const wavesEl = root.querySelector("#voice-waves");
            const timeEl = root.querySelector("#voice-time");

            if (audioEl && playBtn) {
              playBtn.addEventListener("click", () => {
                if (audioEl.paused) {
                  if (SoundEngine.isPlaying) SoundEngine.stopMusic();
                  audioEl.play();
                  btnLabel.textContent = "Pause";
                  wavesEl.classList.add("playing");
                } else {
                  audioEl.pause();
                  btnLabel.textContent = "Play Voice Note";
                  wavesEl.classList.remove("playing");
                }
              });
              audioEl.addEventListener("timeupdate", () => {
                const cur = Math.floor(audioEl.currentTime);
                const dur = isFinite(audioEl.duration) ? Math.floor(audioEl.duration) : giftData.voiceDuration || 0;
                timeEl.textContent = `${cur}s / ${dur}s`;
              });
              audioEl.addEventListener("ended", () => {
                btnLabel.textContent = "Play Voice Note";
                wavesEl.classList.remove("playing");
              });
            }

            root.querySelector("#next-room-5-btn").addEventListener("click", () => {
              if (audioEl && !audioEl.paused) audioEl.pause();
              showMuseumRoom(5);
            });
          }

          function renderRoom5Promises(root) {
            const promises = giftData.promises || [];
            const checked = new Array(promises.length).fill(false);

            root.innerHTML = `
              <div style="text-align: center; margin-bottom: 1.75rem;">
                <div style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700;">Room 05 · The Promises</div>
                <h2 class="font-serif-display" style="font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 0.25rem 0;">Tap each promise to seal them</h2>
              </div>

              <div class="promises-parchment">
                <div id="promises-list">
                  ${
                    promises.length
                      ? promises
                          .map(
                            (pr, idx) => `
                          <div class="promise-item" data-p-idx="${idx}" tabindex="0" role="checkbox" aria-checked="false">
                            <span class="promise-check"><img src="./img/love.png" alt="" class="icon-img" /></span>
                            <span class="font-prose" style="font-size: 1.05rem; line-height: 1.65;">${escapeHtml(pr)}</span>
                          </div>
                        `
                          )
                          .join("")
                      : `<p style="color:var(--ink-muted);">No promises listed.</p>`
                  }
                </div>

                <div style="margin-top: 1.35rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
                  <button type="button" id="seal-all-btn" class="btn btn-secondary btn-sm">Check All</button>
                  <button type="button" id="to-finale-btn" class="btn btn-primary">Grand Finale →</button>
                </div>

                <div id="sealed-stamp" class="sealed-stamp">SEALED</div>
              </div>
            `;

            const stamp = root.querySelector("#sealed-stamp");
            let isStamped = false;
            function checkAllDone() {
              if (!isStamped && promises.length > 0 && checked.every(Boolean)) {
                isStamped = true;
                stamp.classList.add("stamped");
                SoundEngine.playChime();
                triggerConfettiBurst(100);
              }
            }

            root.querySelectorAll(".promise-item").forEach((item) => {
              const idx = Number(item.dataset.pIdx);
              item.addEventListener("click", () => {
                checked[idx] = !checked[idx];
                item.classList.toggle("checked", checked[idx]);
                item.querySelector(".promise-check").innerHTML = checked[idx]
                  ? "✓"
                  : `<img src="./img/love.png" alt="" class="icon-img" />`;
                checkAllDone();
              });
            });

            root.querySelector("#seal-all-btn").addEventListener("click", () => {
              root.querySelectorAll(".promise-item").forEach((item, idx) => {
                checked[idx] = true;
                item.classList.add("checked");
                item.querySelector(".promise-check").textContent = "✓";
              });
              checkAllDone();
            });

            root.querySelector("#to-finale-btn").addEventListener("click", showGrandFinale);
          }

          // STAGE 7: Grand Finale (Exact Day + Month + Year Counter)
          function showGrandFinale() {
            currentViewFn = showGrandFinale;
            startLargeFlowerRain();
            const day = giftData.startDay ?? 1;
            const monthIdx = giftData.startMonth ?? 9;
            const year = giftData.startYear ?? 2026;
            const totalDays = calculateDaysTogether(day, monthIdx, year);
            const monthName = (currentLang === "bn" ? MONTHS_BN : MONTHS_EN)[monthIdx] || "October";

            stageRoot.innerHTML = `
              <section class="stage-screen">
                <div class="finale-card">
                  <img src="./img/love.png" alt="Love" class="icon-img-lg" style="margin-bottom: 0.75rem;" />
                  <div style="font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700;">
                    Since ${escapeHtml(day)} ${escapeHtml(monthName)} ${escapeHtml(year)}
                  </div>
                  <div id="finale-days-num" class="finale-counter tabular-nums">0</div>
                  <div style="font-size: 1.05rem; letter-spacing: 0.14em; font-weight: 700; margin-bottom: 1.5rem;">
                    DAYS OF US, SO FAR
                  </div>

                  <h1 class="font-serif-display" style="font-size: clamp(2rem, 5vw, 3.1rem); margin-bottom: 0.85rem;">
                    ${escapeHtml(giftData.yourName)} & ${escapeHtml(giftData.herName)}
                  </h1>

                  <p class="font-prose" style="font-size: 1.15rem; color: var(--ink-muted); max-width: 50ch; margin: 0 auto 2rem; line-height: 1.8;">
                    “Whatever our souls are made of, yours and mine are the same.”
                  </p>

                  <div style="font-size: 0.92rem; color: var(--ink-muted); margin-bottom: 2rem;">
                    made by hand, for one person
                  </div>

                  <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center;">
                    <button type="button" id="revisit-museum-btn" class="btn btn-secondary">Revisit Rooms</button>
                    <button type="button" id="replay-all-btn" class="btn btn-primary">Replay From Start</button>
                  </div>
                </div>
              </section>
            `;

            const numEl = stageRoot.querySelector("#finale-days-num");
            let current = 0;
            const stepVal = Math.max(1, Math.ceil(totalDays / 40));
            const countTimer = setInterval(() => {
              current = Math.min(totalDays, current + stepVal);
              numEl.textContent = current;
              if (current >= totalDays) clearInterval(countTimer);
            }, 28);

            stageRoot.querySelector("#revisit-museum-btn").addEventListener("click", () => {
              stopLargeFlowerRain();
              showMuseumRoom(1);
            });
            stageRoot.querySelector("#replay-all-btn").addEventListener("click", () => {
              stopLargeFlowerRain();
              showLockScreen();
            });
          }

          showLockScreen();
        }
      })();
    </script>
  </body>
</html>
